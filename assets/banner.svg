<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="auto">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#082f49" />
    </linearGradient>

    <linearGradient id="cyanAura" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="amberAura" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="65%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.65" />
    </filter>

    <style>
      @keyframes pulseAura {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }
      @keyframes floatSoft {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }
      @keyframes dashFlow {
        to { stroke-dashoffset: -120; }
      }
      @keyframes statusBlink {
        0%, 100% { opacity: 1; filter: drop-shadow(0 0 6px #10b981); }
        50% { opacity: 0.35; filter: drop-shadow(0 0 1px #10b981); }
      }
      .pulse-bg {
        animation: pulseAura 7s ease-in-out infinite;
        transform-origin: center;
      }
      .float-card {
        animation: floatSoft 5s ease-in-out infinite;
      }
      .dash-route {
        stroke-dasharray: 8, 8;
        animation: dashFlow 8s linear infinite;
      }
      .blink-dot {
        animation: statusBlink 2.5s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Grid Pattern -->
  <g opacity="0.12">
    <path d="M 0 60 L 1200 60 M 0 120 L 1200 120 M 0 180 L 1200 180 M 0 240 L 1200 240 M 0 300 L 1200 300" stroke="#94a3b8" stroke-width="1" />
    <path d="M 150 0 L 150 360 M 300 0 L 300 360 M 450 0 L 450 360 M 600 0 L 600 360 M 750 0 L 750 360 M 900 0 L 900 360 M 1050 0 L 1050 360" stroke="#94a3b8" stroke-width="1" />
  </g>

  <!-- Ambient Light Auras -->
  <circle cx="200" cy="90" r="240" fill="url(#cyanAura)" class="pulse-bg" />
  <circle cx="1050" cy="270" r="260" fill="url(#amberAura)" class="pulse-bg" />

  <!-- Animated Routing Flow in Background (Does not obscure text) -->
  <g fill="none" opacity="0.35">
    <path d="M 750 85 C 880 40, 1000 140, 1130 90" stroke="#0284c7" stroke-width="3" class="dash-route" />
    <path d="M 780 280 C 920 330, 1020 230, 1150 290" stroke="#f59e0b" stroke-width="2.5" class="dash-route" />
  </g>

  <!-- Right Visual Dashboard Card (Logistics & Routing Telemetry) -->
  <g class="float-card" filter="url(#cardShadow)">
    <!-- Main Card Body -->
    <rect x="800" y="55" width="340" height="245" rx="18" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />

    <!-- Card Header -->
    <rect x="800" y="55" width="340" height="42" rx="18" fill="#1e293b" opacity="0.6" />
    <circle cx="826" cy="76" r="5" fill="#ef4444" opacity="0.8" />
    <circle cx="842" cy="76" r="5" fill="#f59e0b" opacity="0.8" />
    <circle cx="858" cy="76" r="5" fill="#10b981" opacity="0.8" />
    <text x="876" y="80" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">FULFILLMENT DISPATCH ENGINE</text>

    <!-- Operational Metric 1: Order Velocity -->
    <g transform="translate(825, 112)">
      <rect width="290" height="44" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <circle cx="20" cy="22" r="6" fill="#10b981" class="blink-dot" />
      <text x="36" y="19" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Smart Multi-Channel Routing</text>
      <text x="36" y="34" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Active Nodes: 64 Hubs · 99.98% SLA</text>
      <text x="250" y="27" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">LIVE</text>
    </g>

    <!-- Operational Metric 2: WMS Pick/Pack Rate -->
    <g transform="translate(825, 168)">
      <rect width="290" height="44" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text x="16" y="19" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Automated Wave Picking</text>
      <text x="16" y="34" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Walk-Path Optimization · Barcode API</text>
      <text x="235" y="27" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">OPTIMAL</text>
    </g>

    <!-- Metric Badges Row -->
    <g transform="translate(825, 226)">
      <!-- Badge A -->
      <rect x="0" y="0" width="88" height="54" rx="8" fill="#0f172a" stroke="#1e293b" />
      <text x="10" y="20" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="500">ACCURACY</text>
      <text x="10" y="42" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">99.95%</text>

      <!-- Badge B -->
      <rect x="98" y="0" width="94" height="54" rx="8" fill="#0f172a" stroke="#1e293b" />
      <text x="108" y="20" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="500">AVG DISPATCH</text>
      <text x="108" y="42" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">&lt; 24 Hrs</text>

      <!-- Badge C -->
      <rect x="202" y="0" width="88" height="54" rx="8" fill="#0f172a" stroke="#1e293b" />
      <text x="212" y="20" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="500">CARRIERS</text>
      <text x="212" y="42" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">40+ Multi</text>
    </g>
  </g>

  <!-- Left Foreground Typography Section (Clear & Unobscured) -->
  <g transform="translate(65, 0)">
    <!-- Pill Badge -->
    <g transform="translate(0, 68)">
      <rect width="265" height="30" rx="15" fill="#0369a1" fill-opacity="0.3" stroke="#0284c7" stroke-width="1" />
      <circle cx="16" cy="15" r="4.5" fill="#38bdf8" />
      <text x="30" y="20" fill="#e0f2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="0.8">CURATED SUPPLY CHAIN DIRECTORY</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="152" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">Awesome Order Fulfillment</text>

    <!-- Subtitle / Mission Statement -->
    <text x="0" y="196" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400">
      <tspan x="0" dy="0">Top E-Commerce Logistics, 3PL Fulfillment Networks, Multi-Channel Routing,</tspan>
      <tspan x="0" dy="24">Warehouse Management Systems (WMS) &amp; Self-Hosted Supply Chain Stacks.</tspan>
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 252)">
      <!-- Pill 1 -->
      <g>
        <rect width="140" height="28" rx="6" fill="#1e293b" stroke="#334155" />
        <text x="14" y="18" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">⚡ 3PL Networks</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(150, 0)">
        <rect width="145" height="28" rx="6" fill="#1e293b" stroke="#334155" />
        <text x="14" y="18" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">📦 Warehouse WMS</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(305, 0)">
        <rect width="155" height="28" rx="6" fill="#1e293b" stroke="#334155" />
        <text x="14" y="18" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">🔄 Omnichannel Routing</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(470, 0)">
        <rect width="130" height="28" rx="6" fill="#1e293b" stroke="#334155" />
        <text x="14" y="18" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">💻 Self-Hosted APIs</text>
      </g>
    </g>
  </g>
</svg>
